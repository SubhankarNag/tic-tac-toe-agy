<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, 2-player Tic-Tac-Toe game with a sleek dark mode design and smooth animations.">
    <title>Modern Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Theme Toggle -->
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>

        <!-- Start Screen -->
        <section id="startScreen" class="screen active">
            <div class="brand">
                <div class="logo-icon">
                    <span class="x">X</span><span class="o">O</span>
                </div>
                <h1 class="title">Tic Tac Toe</h1>
            </div>
            
            <div class="mode-selection">
                <div class="mode-group">
                    <button class="mode-btn" id="aiModeBtn">
                        <div class="icon-box">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                        </div>
                        <div class="btn-text">
                            <span class="primary-text">1 Player</span>
                            <span class="sub-text">vs AI Opponent</span>
                        </div>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    
                    <div class="difficulty-wrapper" id="difficultyWrapper">
                        <div class="difficulty-selector">
                            <button class="diff-btn" data-diff="easy">Easy</button>
                            <button class="diff-btn" data-diff="medium">Medium</button>
                            <button class="diff-btn" data-diff="hard">Hard</button>
                        </div>
                    </div>
                </div>

                <button class="mode-btn" data-mode="pvp">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="primary-text">2 Players</span>
                        <span class="sub-text">Local Multiplayer</span>
                    </div>
                </button>

                <button class="mode-btn" id="onlineModeBtn">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    </div>
                    <div class="btn-text">
                        <span class="primary-text">Online PvP</span>
                        <span class="sub-text">Play via Internet</span>
                    </div>
                </button>
            </div>
        </section>

        <!-- Lobby Screen -->
        <section id="lobbyScreen" class="screen hidden">
            <h1 class="title">Online Lobby</h1>
            
            <div class="lobby-card">
                <div class="lobby-section">
                    <h3>Create Room</h3>
                    <p class="lobby-desc">Start a new game and share the code.</p>
                    <button class="btn primary-btn" id="createRoomBtn">Create Room</button>
                </div>

                <div class="divider"><span>OR</span></div>

                <div class="lobby-section">
                    <h3>Join Room</h3>
                    <p class="lobby-desc">Enter a code to join a friend.</p>
                    <div class="input-group">
                        <input type="text" id="roomCodeInput" placeholder="Enter 6-digit Code" maxlength="6">
                        <button class="btn secondary-btn" id="joinRoomBtn">Join</button>
                    </div>
                </div>
            </div>

            <div class="waiting-area hidden" id="waitingArea">
                <div class="loader"></div>
                <h3>Waiting for opponent...</h3>
                <p>Share this code with your friend:</p>
                <div class="code-display" id="roomCodeDisplay">------</div>
                <div class="share-actions">
                    <button class="btn icon-btn" id="copyCodeBtn" title="Copy Code">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    </button>
                    <button class="btn icon-btn" id="shareLinkBtn" title="Copy Link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    </button>
                </div>
            </div>

            <button class="btn icon-btn back-btn" id="lobbyBackBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </section>

        <!-- Game Screen -->
        <section id="gameScreen" class="screen hidden">
            <header class="game-header">
                <div class="turn-indicator" id="status">
                    Player <span class="current-player">X</span>'s Turn
                </div>
            </header>

            <div class="game-board" id="board">
                <div class="cell" data-cell-index="0"></div>
                <div class="cell" data-cell-index="1"></div>
                <div class="cell" data-cell-index="2"></div>
                <div class="cell" data-cell-index="3"></div>
                <div class="cell" data-cell-index="4"></div>
                <div class="cell" data-cell-index="5"></div>
                <div class="cell" data-cell-index="6"></div>
                <div class="cell" data-cell-index="7"></div>
                <div class="cell" data-cell-index="8"></div>
            </div>

            <div class="scoreboard">
                <div class="score-box x-score active">
                    <span class="player-label">Player X</span>
                    <span class="score-value" id="scoreX">0</span>
                </div>
                <div class="score-box draw-score">
                    <span class="player-label">Draws</span>
                    <span class="score-value" id="scoreDraw">0</span>
                </div>
                <div class="score-box o-score">
                    <span class="player-label" id="oPlayerName">Player O</span>
                    <span class="score-value" id="scoreO">0</span>
                </div>
            </div>

            <div class="controls">
                <button id="restartBtn" class="btn icon-btn" aria-label="Restart Round">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button id="backBtn" class="btn icon-btn secondary" aria-label="Back to Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            </div>
        </section>
    </div>

    <!-- Modal for Game Over -->
    <div id="gameOverModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="winnerText"></h2>
            <div class="modal-actions">
                <button id="nextRoundBtn" class="btn primary">Play Again</button>
                <button id="quitBtn" class="btn secondary">Exit</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
